[workspace]
authors = ["Frank Loesche <loeschef@janelia.hhmi.org>"]
channels = ["conda-forge"]
name = "G6-ArenaSlim"
platforms = ["linux-64", "osx-arm64", "win-64", "osx-64"]
version = "0.1.0"

[tasks]
deploy = "pio run -e teensy41 -t upload"
deploy-performance = "pio run -e teensy41-performance -t upload"
build = "pio run -e teensy41"
monitor = "mkdir -p log && bash -c 'pio device monitor -e teensy41 2>&1 | tee \"log/$(date +%Y%m%d_%H%M%S).log\"'"
# Serve scripts/web-serial on http://localhost:8000 AND open a Chromium-based
# browser in parallel. The previous one-liner used `;`, which is sequential:
# http.server blocks, so the browser only launched after the server was killed.
# serve.sh backgrounds the browser and foregrounds the server instead.
# NOTE: chromium is NOT on conda-forge, so it can't be a pixi dependency — the
# script uses a system Chromium/Chrome (override with BROWSER=/path/to/chrome).
webserial = "bash scripts/web-serial/serve.sh"
# USB-CDC CIPO bench tools (pyserial ships with the platformio env). Forward args
# after `--`, e.g.  pixi run all-on-serial -- --port /dev/ttyACM0 --label A
all-on-serial = "python scripts/all_on_serial.py"
test-diag    = "pytest tests/test_serial_only.py -v --transport=serial"
# Automated suite excludes guided visual tests (they need a human at the arena).
test-serial  = "pytest tests -v --transport=serial -m 'not visual'"
# Pass controller address after --: pixi run test-tcp -- --ip 10.0.0.x
test-tcp     = "pytest tests -v --transport=tcp -m 'not visual'"
# Guided VISUAL tests only — needs an observer at the arena. Supply a multi-frame
# pattern after --, e.g.:
#   pixi run test-serial-visual -- --pat ../webDisplayTools/patterns/g6_2x10/patterns/002_grating_sq.pat
#   pixi run test-tcp-visual    -- --ip 10.0.0.x --pat .../002_grating_sq.pat
# NOTE: keep the serial/tcp task pair in sync — any change to one must mirror in the other.
test-serial-visual = "pytest tests -v --transport=serial -m visual --visual -s"
test-tcp-visual    = "pytest tests -v --transport=tcp -m visual --visual -s"
test         = { depends-on = ["test-serial"] }
multi-capture = "python scripts/multi_port_capture.py"

[dependencies]
platformio = ">=6.1.19,<7"
pytest = ">=8"

# ── Isolated AD3 / dwfpy debug environment ─────────────────────────────────
# Used for bench-side SPI / logic-analyzer captures. Solves independently of
# the PlatformIO env so its Python dependencies can't drift the firmware build.
# Requires the Digilent WaveForms runtime to be installed system-wide
# (.deb on Linux); dwfpy loads libdwf at import time.
[feature.debugad3.dependencies]
python = ">=3.10"
matplotlib = "*"

[feature.debugad3.pypi-dependencies]
dwfpy = "*"
numpy = "*"

[feature.debugad3.tasks]
spi-capture = "python debug/spi_capture.py"
plot-recent = "python debug/plot_capture.py"
dump-spi    = "python debug/dump_spi.py"
node-scope  = "python debug/measure_shared_node.py"
compare-node = "python debug/compare_pin4_node.py"
cs-count    = "python debug/cs_count.py"

[environments]
debugad3 = ["debugad3"]
