; Minimal reproducer for the Teensy 4.x IntervalTimer::end() / pit_isr() race
; (cores/teensy4/IntervalTimer.cpp): end() nulls the callback BEFORE disabling the
; channel, and pit_isr() acknowledges TFLG only when the callback is non-null.
; A tick inside that window leaves TFLG set forever -> PIT interrupt storm ->
; thread mode never runs again. Build: pio run -d tools/pit-race-repro
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
