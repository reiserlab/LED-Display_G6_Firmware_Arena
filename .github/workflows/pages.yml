name: Deploy Web Serial UI to GitHub Pages

# Publishes the contents of scripts/web-serial/ as the repository's GitHub
# Pages site (index.html ends up at the site root). Web Serial needs a secure
# context — Pages serves over HTTPS, so the UI works there as-is.
#
# One-time setup: in the repo, Settings → Pages → "Build and deployment" →
# Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "scripts/web-serial/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Permissions required by the Pages deploy actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress run so a
# publish always finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload scripts/web-serial as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: scripts/web-serial

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
