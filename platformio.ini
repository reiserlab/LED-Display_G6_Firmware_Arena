; Shared settings for every hardware variant / build type. Never build this
; base env directly -- it has no ARENA_HW_* flag, so the firmware won't
; compile (see the #error in src/constants.h and src/ArenaConfig.h).
[env:teensy41-base]
platform = teensy
board = teensy41
framework = arduino
lib_deps =
    ssilverman/QNEthernet
upload_protocol = teensy-cli
monitor_speed = 115200
extra_scripts =
    pre:scripts/patch_usb_strings.py
    pre:scripts/find_teensy.py
    pre:scripts/build_version.py

; arena_10-10 (the current production board): release and debug builds.
[env:teensy41-10-10-performance]
extends = env:teensy41-base
build_flags = -DARENA_HW_10_10

[env:teensy41-10-10]
extends = env:teensy41-base
build_flags =
    -DARENA_HW_10_10
    -DDEBUG_SERIAL

; arena_12-18: release and debug builds. Same base settings, different
; hardware flag -> different ArenaConfig.h CS map and frame geometry.
[env:teensy41-12-18-performance]
extends = env:teensy41-base
build_flags = -DARENA_HW_12_18

[env:teensy41-12-18]
extends = env:teensy41-base
build_flags =
    -DARENA_HW_12_18
    -DDEBUG_SERIAL
