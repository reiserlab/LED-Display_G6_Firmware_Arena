[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
lib_deps =
    ssilverman/QNEthernet
upload_protocol = teensy-cli
monitor_speed = 115200
; Target the Teensy by its stable by-id symlink rather than /dev/ttyACMx, whose
; number shifts with enumeration order (and collides with a panel in USB-serial
; mode). Find a different board's path with:
;   ls /dev/serial/by-id/usb-Teensyduino_USB_Serial_*-if00
monitor_port = /dev/serial/by-id/usb-Teensyduino_USB_Serial_15283630-if00

[env:teensy41-printf]
extends = env:teensy41
build_flags = -DDEBUG_SERIAL

; ── CIPO/MISO contention bench experiment (debug/CIPO_investigation.md) ──────
; A/B test build "B": hold the otherwise-floating CS-decode lines HIGH so the
; per-column MISO-enable buffers are strictly one-hot. If CIPO becomes readable
; vs the teensy41-printf baseline, floating-CS contention is confirmed.
[env:teensy41-csidle]
extends = env:teensy41
build_flags = -DDEBUG_SERIAL -DCS_IDLE_HIGH

; Positive control build "C": idle CS lines fixed HIGH AND a second B0 buffer
; deliberately enabled during each captured read. CIPO should collapse to 00,
; demonstrating the wired-OR contention mechanism directly.
[env:teensy41-contention]
extends = env:teensy41
build_flags = -DDEBUG_SERIAL -DCS_IDLE_HIGH -DFORCE_CONTENTION
